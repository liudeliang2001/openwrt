name: Build Official OpenWrt v25.12.5 (x86_64 with eBPF & IPv6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5   # 精准锁定官方 v25.12.5 版本标签

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 仅清理占用空间的工具链目录，保留系统软件源配置
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison gstreamer1.0-plugins-base libssl-dev libglib2.0-dev libxml2-dev libpcap-dev libelf-dev file python3-pip

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Configuration & Dependencies
        run: |
          # 1. 引入第三方 Feeds / 软件包 (如 Argon 主题)
          git clone https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon

          # 2. 目标架构配置 (x86_64)
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config

          # 3. 对齐 dae 官方要求的完整 eBPF 内核依赖选项
          echo "CONFIG_BPF=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          echo "CONFIG_BPF_JIT=y" >> .config
          echo "CONFIG_CGROUPS=y" >> .config
          echo "CONFIG_KPROBES=y" >> .config
          echo "CONFIG_NET_INGRESS=y" >> .config
          echo "CONFIG_NET_EGRESS=y" >> .config
          echo "CONFIG_NET_SCH_INGRESS=m" >> .config
          echo "CONFIG_NET_CLS_BPF=m" >> .config
          echo "CONFIG_NET_CLS_ACT=y" >> .config
          echo "CONFIG_BPF_STREAM_PARSER=y" >> .config
          echo "CONFIG_DEBUG_INFO=y" >> .config
          echo "# CONFIG_DEBUG_INFO_REDUCED is not set" >> .config
          echo "CONFIG_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_KPROBE_EVENTS=y" >> .config
          echo "CONFIG_BPF_EVENTS=y" >> .config

          # 4. 必备组件与驱动 (含 eBPF 模块、TUN 驱动、IPv6 及常用工具)
          echo "CONFIG_PACKAGE_kmod-bpf=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sched-core=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sched-bpf=y" >> .config
          echo "CONFIG_PACKAGE_kmod-cls-bpf=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_bash=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_odhcpd-ipv6only=y" >> .config
          echo "CONFIG_PACKAGE_odhcp6c=y" >> .config

          # 5. 仅剔除 PPPoE 拨号组件，保留 IPv6
          echo "# CONFIG_PACKAGE_ppp is not set" >> .config
          echo "# CONFIG_PACKAGE_ppp-mod-pppoe is not set" >> .config

          # 生成默认配置文件
          make defconfig

      - name: Download Packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo "Building..."
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Release
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-v25.12.5-x86_64-eBPF-IPv6-Firmware
          path: bin/targets/x86/64/*-generic-squashfs-combined-efi.img.gz
